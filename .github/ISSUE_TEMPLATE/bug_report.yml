name: Relatar um bug
description: Algo não funciona como esperado
labels: [bug]
body:
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu
      description: Descreva o problema e o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: como-reproduzir
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abra a tela...
        2. Clique em...
        3. Veja o erro
    validations:
      required: true
  - type: dropdown
    id: modo
    attributes:
      label: Modo de uso
      options:
        - Demo pública
        - Self-hosted (Ollama)
    validations:
      required: true
  - type: input
    id: ambiente
    attributes:
      label: Navegador e sistema
      placeholder: Chrome 130, Windows 11
