version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # eslint-config-next ainda depende de plugins (import, jsx-a11y) que só suportam o ESLint 9.
      # Rever quando o eslint-config-next declarar suporte ao ESLint 10.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # A partir da 6.1 o plugin pede @babel/core 8, e shadcn e eslint-config-next ainda usam o Babel 7
      # (ERESOLVE). Rever quando essas dependências migrarem para o Babel 8.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      # Os tipos acompanham o Node do CI e dos engines (22 / >=20.9): tipos de um Node mais novo
      # deixariam passar APIs que não existem no runtime. Subir junto com o Node do CI.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
